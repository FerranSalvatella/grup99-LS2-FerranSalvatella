# Profile used only by the automated tests (mvn verify, CI).
# The tests run without a PostgreSQL server, so they use an in-memory H2 database.
# H2 is a test dependency only: the real application (dev and prod) uses PostgreSQL (NFR-01).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
pro_tube.load_initial_data=false
